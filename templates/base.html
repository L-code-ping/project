<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}AI 小说转剧本{% endblock %}</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f5f7fa; }
        nav { background: #2c3e50; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin-left: 15px; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
    </style>
</head>
<body>
    <nav>
        <div>
            <a href="/" style="font-size:18px;">🎬 剧本转换器</a>
        </div>
        <div>
            {% if current_user.is_authenticated %}
                <span style="color:#ecf0f1;">👤 {{ current_user.username }}</span>
                <a href="/history">📋 历史记录</a>
                <a href="/logout">退出</a>
            {% else %}
                <a href="/login">登录</a>
                <a href="/register">注册</a>
            {% endif %}
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
