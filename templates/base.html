<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI 小说转剧本工具{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f7fa; }
        .navbar { background: #2c3e50; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h1 { color: white; font-size: 20px; }
        .navbar a { color: white; text-decoration: none; margin-left: 20px; }
        .navbar a:hover { color: #3498db; }
        .navbar-right { display: flex; align-items: center; }
        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <h1>📖 小说转剧本工具</h1>
        <div class="navbar-right">
            <a href="{{ url_for('index') }}">首页</a>
            {% if current_user.is_authenticated %}
                <a href="{{ url_for('history') }}">历史记录</a>
                <a href="{{ url_for('auth.logout') }}">退出登录</a>
            {% else %}
                <a href="{{ url_for('auth.login') }}">登录</a>
                <a href="{{ url_for('auth.register') }}">注册</a>
            {% endif %}
        </div>
    </nav>
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
